<div class="form-container">
  <div class="form-header">
    <h1>Edit Task</h1>
    <span class="task-id-pill">#{{ taskId() }}</span>
  </div>

  @if (message()) {
    <div class="status-message">{{ message() }}</div>
  }

  <form #editForm="ngForm" (ngSubmit)="onUpdateTask()">
    <div class="form-group">
      <label for="title">Title *</label>
      <input
        id="title"
        name="title"
        type="text"
        required
        [(ngModel)]="title"
      />
    </div>

    <div class="form-group">
      <label for="description">Description *</label>
      <textarea
        id="description"
        name="description"
        required
        [(ngModel)]="description"
      ></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority" [(ngModel)]="priority">
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="isCompleted" [(ngModel)]="isCompleted">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="dueDate">Due Date</label>
        <input
          id="dueDate"
          name="dueDate"
          type="date"
          [(ngModel)]="dueDate"
        />
      </div>

      <div class="form-group">
        <label for="remark">Remark</label>
        <input
          id="remark"
          name="remark"
          type="text"
          [(ngModel)]="remark"
        />
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" routerLink="/List">
        Cancel
      </button>
      <button type="submit" class="btn-update" [disabled]="editForm.invalid">
        Save Changes
      </button>
    </div>
  </form>
</div>
